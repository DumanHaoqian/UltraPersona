    name: P504 Student Lab
    name_zh: P504 学生实验室
    file: backgrounds/lab.jpeg
    scene: a university lab with a red robot arm serving coffee and a PolyU logo above the coffee machine
    stand: behind the white counter on the right side, so the robot arm and the PolyU logo stay visible
    max_people: 3
  3:
    name: PolyU Great Lawn
    name_zh: 理大大草坪
    file: backgrounds/grass.jpeg
    scene: the green lawn in front of red-brick university buildings and a wide staircase under a blue sky
    stand: on the green lawn in the foreground, centred in front of the staircase
    max_people: 5
  4:
    name: A Garden
    name_zh: 空中花园
    file: backgrounds/a_garden.jpeg
    scene: a rooftop garden with a stone path, red-brick towers and trees
    stand: on the stone path in the middle of the garden
    max_people: 5
  5:
    name: Clock Square
    name_zh: 钟楼广场
    file: backgrounds/clock.jpeg
    scene: a campus square with a red steel clock tower next to a red-brick building
    stand: on the paved square to the right of the red clock tower, without covering the clock
    max_people: 5
  6:
    name: Library Gate
    name_zh: 图书馆正门
