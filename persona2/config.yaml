# engine: qwen = Qwen-Image-Edit text instruction; opencv = local filter, no model.
styles:
  0:
    name: Photo (no style)
    name_zh: 写实照片
    engine: none
    prompt: ""
  1:
    name: Van Gogh Starry Night
    name_zh: 梵高《星空》
    engine: qwen
    prompt: a Van Gogh oil painting in the style of The Starry Night, with swirling brush strokes, thick impasto and a deep blue and yellow palette
  2:
    name: One Last Kiss
    name_zh: One Last Kiss
    engine: opencv
    prompt: ""
  3:
    name: Professional 3D
    name_zh: 3D 动画
    engine: qwen
    prompt: a high-quality 3D animated film still with soft studio lighting and smooth stylised characters
  4:
    name: JoJo Style
    name_zh: JoJo 漫画
    engine: qwen
    prompt: a Japanese manga illustration with bold ink outlines, dramatic poses, strong shading and vivid colours, in the style of 1990s action manga
  5:
    name: Cyberpunk 2077
    name_zh: 赛博朋克
    engine: qwen
    prompt: a cyberpunk night scene with neon lights, holographic signs, wet reflective ground and futuristic clothing
  6:
    name: Medieval Style
    name_zh: 中世纪
    engine: qwen
    prompt: a medieval scene where the buildings look like stone castles and the people wear medieval clothing, painted like a Renaissance oil painting
  7:
    name: Abstract Animation
    name_zh: 扁平动画
    engine: qwen
    prompt: a flat 2D animation frame with clean lines and simple flat colours
  8:
    name: Miro Style
    name_zh: 米罗
    engine: qwen
    prompt: a Joan Miro painting with playful abstract shapes, black lines and primary colours
  9:
    name: Modigliani
    name_zh: 莫迪利亚尼
    engine: qwen
    prompt: a Modigliani painting with elongated faces and necks, almond-shaped eyes and warm muted colours
