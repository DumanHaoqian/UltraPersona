# UltraPersona v2 configuration.
# Paths are relative to the repo root unless absolute.

model:
  path: /mnt/d/hf_models/Qwen-Image-Edit-2511
  quantized_dir: /mnt/d/hf_models/quantized   # quantize.py writes <dir>/<preset>/
  lightning_lora: /mnt/d/hf_models/Qwen-Image-Edit-2511-Lightning
  default_preset: nf4_mix    # nf4_mix | fp8 | nf4 (see persona2/qwen_edit.py and experiments/QUANT_NOTES.md)
  restore_background: false  # true = paste the generated people back onto the original background photo
                             # (exact landmarks, weaker light match). Decision pending.
  default_mode: onestep      # onestep | twostep; a style can override with its own "mode". See experiments/results/one_vs_two/v1/report.md
  steps: 40
  lightning: L8              # null = full model (40 steps, CFG 4) | L8 | L4: Lightning weights merged by tools/merge_lora.py (experiments/SPEED.md)
  lightning_models:
    L8: {transformer: /mnt/d/hf_models/Qwen-Image-Edit-2511-L8/transformer, steps: 8}
    L4: {transformer: /mnt/d/hf_models/Qwen-Image-Edit-2511-L4/transformer, steps: 4}
  true_cfg_scale: 4.0
  vram_cap_gb: 30            # hard cap passed to torch.cuda.set_per_process_memory_fraction

control:                     # see persona2/control.py and experiments/CONTROL.md
  lock: false                # approach 1: on helps the 40-step model only; with L8 the free edit already keeps the background (SPEED.md)
  lock_release_photo: 0.85   # fraction of steps locked, photo style (late release blends the edges)
  lock_release_style: 0.5    # art styles: lock the first half of the steps to the stylized background
  lock_inner_release: 0.2    # first 20% of steps: whole picture locked to (people from a free edit + background)
  mask_dilate_px: 24         # free band around the people (pixels at output size)
  mask_feather_px: 6
  id_guide: false            # approach 5: off, it damages faces it does not need to fix (CONTROL.md)
  guide_scale: 0.02           # with clip 2; larger steps damage faces (experiments/guide_sanity.py)
  guide_sigma: [0.4, 0.85]   # middle noise levels only; later steps clean up what guidance adds
  guide_blur: 1.5            # blur of the gradient in latent cells, against adversarial patterns
  guide_aug: 4               # jittered / flipped face crops per face
  lock_target_style: styled  # art styles lock to the background redrawn in the style (cached), not the photo
  repair: true               # approach 3: redraw low-scoring faces at a larger scale
  repair_single: false       # also for one-person photos
  repair_art_styles: false   # art styles: score rises but some repaired faces look worse (CONTROL.md)
  repair_lock: true
  repair_guide: false        # guidance on large faces damages them (control_probe4)
  repair_lock_release: 0.8
  repair_steps: 28
  repair_region_scale: 3.0  # face ~340px in the 1024 region, so the guided decode stays under max_latent

quality:
  # LFW calibration (experiments/results/face_calibration.json): same person mean 0.64 (p10 0.51),
  # different people mean 0.01 (p99 0.15), best same/different split 0.21. 0.35 sits between them.
  face_sim_min: 0.35
  max_retries: 2
  candidates: 1              # >1 = generate several seeds and keep the best face match

analysis:
  min_face_px: 64            # shorter side of the face box in the input photo
  min_sharpness: 40          # variance of Laplacian on the face crop
  max_people: 5

