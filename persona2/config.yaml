# UltraPersona v2 configuration.
# Paths are relative to the repo root unless absolute.

model:
  path: /mnt/d/hf_models/Qwen-Image-Edit-2511
  quantized_dir: /mnt/d/hf_models/quantized   # quantize.py writes <dir>/<preset>/
  lightning_lora: /mnt/d/hf_models/Qwen-Image-Edit-2511-Lightning
  default_preset: nf4_mix    # nf4_mix | fp8 | nf4 (see persona2/qwen_edit.py and experiments/QUANT_NOTES.md)
  restore_background: false  # true = paste the generated people back onto the original background photo
                             # (exact landmarks, weaker light match). Decision pending.
  default_mode: twostep      # onestep | twostep; set from experiments/one_vs_two results
  steps: 40
  true_cfg_scale: 4.0
  vram_cap_gb: 30            # hard cap passed to torch.cuda.set_per_process_memory_fraction

quality:
  # LFW calibration (experiments/results/face_calibration.json): same person mean 0.64 (p10 0.51),
  # different people mean 0.01 (p99 0.15), best same/different split 0.21. 0.35 sits between them.
  face_sim_min: 0.35
  max_retries: 2
  candidates: 1              # >1 = generate several seeds and keep the best face match

analysis:
  min_face_px: 64            # shorter side of the face box in the input photo
  min_sharpness: 40          # variance of Laplacian on the face crop
  max_people: 5

backgrounds:
  1:
    name: Jockey Club Innovation Tower
    name_zh: 赛马会创新楼
    file: backgrounds/Y.jpg
    scene: the plaza in front of the white curved Jockey Club Innovation Tower, next to the "POLYU DESIGN" sign
    stand: on the paved plaza in the lower middle of the picture, in front of the "POLYU DESIGN" sign
    max_people: 5
